<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JPLUS 公司協作原型｜登入</title>
<style>body{margin:0;background:#edf2f8;color:#173452;font:16px/1.7 system-ui}main{max-width:420px;margin:12vh auto;background:white;padding:32px;border-radius:16px;border-top:6px solid #b58a38}h1{color:#003366;font-size:26px}label{display:block;margin:18px 0}input{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border:1px solid #aabccd;border-radius:6px}button{background:#003366;color:white;border:0;border-radius:6px;padding:13px;width:100%;font-size:16px}#message{color:#9d293b}small{color:#52677c}@media(max-width:600px){main{margin:30px 16px;padding:24px}}</style>
<main><b>JPLUS · 樂加智</b><h1>業務與財務協作原型</h1><p>登入公司資料庫，依帳號角色與 PO 授權存取。</p><form id="login"><label>帳號<input name="login" autocomplete="username" required maxlength="100"></label><label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登入</button><p id="message" role="alert"></p></form><small>此為可測試原型。啟用正式多人操作前，需完成內網部署、HTTPS、帳號開通與備份驗證。</small></main>
<script nonce="@@NONCE@@">document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),j=await r.json();if(!r.ok)throw Error(j.error);location.href='/workspace'}catch(x){document.querySelector('#message').textContent=x.message}finally{b.disabled=false}};</script></html>
